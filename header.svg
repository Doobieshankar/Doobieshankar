<svg width="860" height="160" viewBox="0 0 860 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#38bdf8;#34d399;#a78bfa" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#34d399;#a78bfa;#38bdf8" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#a78bfa;#38bdf8;#34d399" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="underline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="20%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="860" height="160" fill="#08080d" rx="12"/>

  <!-- subtle grid dots instead of lines -->
  <g opacity="0.15">
    <circle cx="215" cy="40" r="1" fill="#475569"/>
    <circle cx="430" cy="40" r="1" fill="#475569"/>
    <circle cx="645" cy="40" r="1" fill="#475569"/>
    <circle cx="215" cy="80" r="1" fill="#475569"/>
    <circle cx="430" cy="80" r="1" fill="#475569"/>
    <circle cx="645" cy="80" r="1" fill="#475569"/>
    <circle cx="215" cy="120" r="1" fill="#475569"/>
    <circle cx="430" cy="120" r="1" fill="#475569"/>
    <circle cx="645" cy="120" r="1" fill="#475569"/>
  </g>

  <!-- corner accents -->
  <path d="M12 4 L12 20 M4 12 L20 12" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M848 4 L848 20 M852 12 L840 12" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M12 156 L12 140 M4 148 L20 148" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M848 156 L848 140 M852 148 L840 148" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- subtle background glow behind text -->
  <ellipse cx="430" cy="85" rx="220" ry="40" fill="#a78bfa" opacity="0.02" filter="url(#softglow)"/>

  <!-- main name -->
  <text x="430" y="92" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="64" font-weight="700" fill="url(#g1)" filter="url(#glow)" letter-spacing="6">
    SHANKAR
  </text>

  <!-- gradient underline -->
  <line x1="260" y1="102" x2="600" y2="102" stroke="url(#underline)" stroke-width="1"/>

  <!-- subtitle -->
  <text x="430" y="126" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#475569" letter-spacing="4">FULL STACK DEVELOPER · TIRUPPUR, INDIA</text>

  <!-- top-left label -->
  <text x="26" y="28" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="9" fill="#2d3748" letter-spacing="2">// gotoz · 2026</text>

  <!-- top-right label -->
  <text x="834" y="28" text-anchor="end" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="9" fill="#2d3748" letter-spacing="2">v1.0.0</text>

  <!-- bottom subtle border glow -->
  <rect x="0" y="158" width="860" height="2" rx="0" fill="url(#g1)" opacity="0.15"/>
</svg>
