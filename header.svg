<svg width="860" height="160" viewBox="0 0 860 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#38bdf8;#34d399;#a78bfa" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#34d399;#a78bfa;#38bdf8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#a78bfa;#38bdf8;#34d399" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="860" height="160" fill="#0a0a0f" rx="12"/>
  <!-- grid lines -->
  <line x1="0" y1="40" x2="860" y2="40" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="0" y1="80" x2="860" y2="80" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="0" y1="120" x2="860" y2="120" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="215" y1="0" x2="215" y2="160" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="430" y1="0" x2="430" y2="160" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="645" y1="0" x2="645" y2="160" stroke="#1e293b" stroke-width="0.5"/>
  <!-- corner dots -->
  <circle cx="12" cy="12" r="3" fill="#7c3aed" opacity="0.6"/>
  <circle cx="848" cy="12" r="3" fill="#0891b2" opacity="0.6"/>
  <circle cx="12" cy="148" r="3" fill="#059669" opacity="0.6"/>
  <circle cx="848" cy="148" r="3" fill="#7c3aed" opacity="0.6"/>
  <!-- main name -->
  <text x="430" y="95" text-anchor="middle" font-family="'Courier New', monospace" font-size="72" font-weight="700" fill="url(#g1)" filter="url(#glow)" letter-spacing="-2">
    SHANKAR
    <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <!-- subtitle -->
  <text x="430" y="128" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#475569" letter-spacing="6">FULL STACK DEVELOPER · TIRUPPUR, INDIA</text>
  <!-- blinking cursor -->
  <rect x="680" y="108" width="3" height="18" fill="#a78bfa">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- top label -->
  <text x="24" y="28" font-family="'Courier New', monospace" font-size="10" fill="#334155" letter-spacing="2">// gotoz · 2026</text>
  <text x="836" y="28" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#334155" letter-spacing="2">v1.0.0</text>
</svg>
